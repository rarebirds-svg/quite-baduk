[project]
name = "baduk-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.19",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "structlog>=24.1",
  "websockets>=12.0",
  "greenlet>=3.0",
  "sgfmill>=1.1.1",
  "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B","UP","S","W"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 한 테스트가 이 시간을 넘기면 실패시킨다. 교착(특히 테스트 간에 재사용되는
# 프로세스-글로벌 asyncio.Lock)이 CI 잡 한도 6시간을 통째로 태우는 것을 막고,
# 멈춘 지점의 트레이스백을 남긴다. 최장 테스트가 1초대라 120초는 넉넉하다.
# method는 기본값(POSIX=signal)을 쓴다 — 멈춘 테스트만 실패하고 나머지는 계속 돈다.
timeout = 120
