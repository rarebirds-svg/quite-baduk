# FAQ 시드 — slug·title(질문)·prompt_hint.
#
# 토픽 선정 기준 4가지 — 새 항목은 아래 네 축에 고르게 분포시킨다.
#  1) 서비스 사용 질문 — 세션·일일 챌린지·관전·SGF·급수 선택·무르기·힌트·모바일
#  2) 입문 검색 의도 — 처음 두는 사람의 규칙·승패·시작 방법 질문
#  3) 학습 검색 의도 — 실력 향상·연습 방법·AI 활용 질문
#  4) 내부링크 — 답변이 글로서리 항목으로 자연스럽게 이어질 것
#
- slug: ai-baduk-vs-human
  title: AI 바둑은 사람과 어떻게 다른가요?
  prompt_hint: KataGo Human-SL — 사람의 기풍을 학습해 자연스러운 수. 일반 KataGo와 차이. 학습 데이터 출처.
- slug: review-and-analysis
  title: 복기·승부처 분석은 무엇인가요?
  prompt_hint: 종국 후 수순 재생 + 매 수의 승률 변화. 승부처(큰 변동 지점) 자동 표시. KataGo 분석.
- slug: nickname-session
  title: 닉네임 세션이란?
  prompt_hint: 이메일·비밀번호 없이 닉네임만으로 임시 세션. HttpOnly 쿠키, 1시간 idle TTL. 개인정보 비수집.
- slug: korean-vs-japanese-rules
  title: 한국 규칙과 일본 규칙의 차이는?
  prompt_hint: 계가법(영토 + 잡은 돌 vs 영토만), 덤(6.5 vs 6.5), 빅·자살 처리 등 미세한 차이.
- slug: how-to-improve-rank
  title: 단을 얻으려면 어떻게 두면 되나요?
  prompt_hint: 정석 학습, 사활 문제, 복기, 실전. 적정 상대와의 대국. 기력 향상 일반 조언.
- slug: board-sizes
  title: 9로·13로·19로 중 무엇으로 둘까요?
  prompt_hint: inkbaduk은 9·13·19로를 지원. 규칙은 같고 반의 크기만 다름. 9·13로는 짧고 빨라 입문·연습에, 19로가 정규 대국. 작은 반은 전투, 큰 반은 포석·운영 비중이 큼.
- slug: ai-strength-levels
  title: AI 기력(난이도)은 어떻게 정해지나요?
  prompt_hint: UI에서 고른 랭크에 맞춰 KataGo Human-SL이 그 기력의 사람처럼 둠. 추가로 maxVisits(탐색량)로 강도를 조절 — 높은 단일수록 강하고 CPU에서는 느림. 일반 KataGo와 달리 사람다운 기풍.
- slug: spectate-pro
  title: 프로 기보 감상은 무엇인가요?
  prompt_hint: 저작권이 안전한 공개 도메인 프로 기보를 수순대로 두며 KataGo 분석과 함께 감상. 테마별·월간 추천(picks) 모음 제공. 상용 기보 사이트 자료는 쓰지 않음.
- slug: resign-and-pass
  title: 기권하거나 대국을 끝내려면?
  prompt_hint: 더 둘 곳이 없으면 양쪽이 두 번 연속 패스해 종국 → 자동 계가. 승산이 없다고 판단하면 기권으로 즉시 종료. 종국·계가는 한국 룰 기준.

# ── 기준 1. 서비스 사용 질문 (10) ───────────────────────────────────────────
- slug: is-it-free
  title: 회원가입이나 결제가 필요한가요?
  prompt_hint: 회원가입·결제 없이 무료로 쓴다. 닉네임만 적으면 바로 대국이 열리고 이메일·비밀번호는 받지 않는다. 후원 페이지는 있지만 어디까지나 선택. 개인정보를 최소로 수집한다는 점을 강조.
- slug: quick-start-9x9
  title: 가장 빨리 한 판 두려면 어떻게 하나요?
  prompt_hint: 홈 화면의 바로 두기에 닉네임 한 줄만 넣으면 9줄판·9급·호선 기본 설정으로 대국이 바로 열린다. 판 크기·급수·치수를 고르고 싶으면 상세 설정으로 시작. 처음에는 9줄판 권장.
- slug: session-90-days
  title: 내 기록은 얼마나 보관되나요?
  prompt_hint: 닉네임 세션이 이 브라우저에 90일간 보관되고 방문할 때마다 자동 연장된다. 로그인 없이 전적·복기가 이어진다. 브라우저 데이터를 지우거나 다른 기기로 옮기면 이어지지 않는다. 자세한 내용은 개인정보처리방침.
- slug: daily-puzzle
  title: 일일 챌린지(데일리 퍼즐)는 어떻게 이용하나요?
  prompt_hint: 주어진 형세에서 최선의 한 수를 찾아 제출하는 연습 문제. 400문제가 넘게 쌓여 있어 이어서 계속 풀 수 있고 로그인 없이 무료다. 판 크기·유형(포석·정석·사활 등)·난이도로 걸러 고르며 채점 후 추천 수를 확인. 수읽기 훈련에 좋음.
- slug: game-history
  title: 지난 대국을 다시 볼 수 있나요?
  prompt_hint: 전적 화면에서 지난 대국 목록을 열고 복기로 수순을 되짚어 볼 수 있다. 세션이 유지되는 동안 같은 브라우저에서 계속 남는다. 승률 그래프로 패착을 찾는 흐름을 안내.
- slug: download-sgf
  title: 내 기보를 파일로 저장할 수 있나요?
  prompt_hint: 대국이 끝나면 기보 보기에서 SGF 파일로 내려받을 수 있다. SGF는 표준 형식이라 다른 바둑 프로그램에서도 열린다. 이용자가 둔 기보는 이용자에게 귀속되며 자유롭게 보관·공유 가능.
- slug: undo-and-hint
  title: 무르기와 힌트를 써도 되나요?
  prompt_hint: 승부보다 배우는 데 목적이 있으니 얼마든지 써도 된다. 무르기는 방금 둔 수를 물러 주며 한 대국에 세 번까지 쓸 수 있고, 힌트는 KataGo가 추천하는 한 수를 보여 준다. 쓰고 나서 왜 그 자리인지 생각해 보는 것이 요령.
- slug: choose-ai-rank
  title: 내 실력에 맞는 AI 급수는 어떻게 고르나요?
  prompt_hint: 급수를 모르면 대국 설정의 짧은 질문 두 개로 시작 급수를 추천받는다. 이기고 지는 비율이 반반쯤 되는 급수가 적정선. 버거우면 치수를 올려 접바둑으로, 여유가 있으면 급수를 올려 조절.
- slug: mobile-play
  title: 휴대폰에서도 둘 수 있나요?
  prompt_hint: 앱을 따로 깔지 않고 휴대폰 브라우저로 바로 둘 수 있다. 화면 크기에 맞춰 판과 정보 패널이 재배치된다. 작은 화면에서는 9줄·13줄판이 편하다. 세션은 기기·브라우저마다 따로 잡히므로 폰과 PC의 전적은 이어지지 않는다는 점을 덧붙일 것.
- slug: pro-game-archive
  title: 프로 기보는 어디서 가져온 것인가요?
  prompt_hint: 저작권 위험이 없는 공개 도메인 컬렉션만 쓴다. 3,300국이 넘게 쌓여 있고 테마별·월간 추천 모음으로도 볼 수 있다. 상용 기보 사이트 자료는 쓰지 않는다는 원칙을 분명히.

# ── 기준 2·3. 입문·학습 검색 의도 (5) ───────────────────────────────────────
- slug: how-to-count-score
  title: 바둑은 승패를 어떻게 정하나요?
  prompt_hint: 종국 후 자기 집에 잡은 돌을 더해 비교하고 흑은 덤 6.5집을 뺀다(한국 룰, 접바둑은 0.5집). 반집 단위라 무승부가 없다. 잉크바둑은 두 번 연속 패스하면 자동으로 계가해 준다.
- slug: first-game-tips
  title: 바둑을 처음 두는데 무엇부터 배워야 하나요?
  prompt_hint: 활로와 단수, 따냄, 두 눈까지 네 가지면 한 판을 끝까지 둘 수 있다. 9줄판으로 시작해 몇 판 두어 보고 사활 문제로 수읽기를 붙이는 순서를 권한다. 정석 암기는 나중 일.
- slug: how-long-a-game
  title: 한 판 두는 데 시간이 얼마나 걸리나요?
  prompt_hint: 9줄판은 5~10분, 13줄판은 15~25분, 19줄판은 40분 이상이 보통. 제한시간이 없어 원하는 만큼 생각해도 된다. 다만 높은 급수는 AI가 더 오래 읽으므로 응답이 느려진다는 점을 안내.
- slug: why-lose-to-ai
  title: AI에게 계속 지는데 어떻게 해야 하나요?
  prompt_hint: 지는 것이 정상이며 급수를 낮추거나 치수를 올려 접바둑으로 두면 된다. 판을 9줄로 줄여 전투만 연습하는 방법도 있다. 진 판마다 승률 그래프에서 낙폭이 가장 큰 한 수만 복기하면 충분.
- slug: baduk-vs-omok
  title: 바둑과 오목은 어떻게 다른가요?
  prompt_hint: 같은 판과 돌을 쓰지만 목표가 다르다. 오목은 다섯 점을 먼저 잇는 쪽이 이기고, 바둑은 집이 더 넓은 쪽이 이긴다. 바둑은 돌을 따내는 규칙과 종국·계가 절차가 따로 있어 배울 것이 조금 더 많다.
