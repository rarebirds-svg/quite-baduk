# 글로서리 시드 — slug·title·prompt_hint. LLM이 본문 작성, 사람이 새 항목 추가 시 여기에.
#
# 토픽 선정 기준 4가지 — 새 항목은 아래 네 축에 고르게 분포시킨다.
#  1) 입문 검색 의도 — 바둑 두는법·규칙 계열(착수금지·활로·두 눈·종국·반집·기보 등)
#  2) 학습 검색 의도 — 사활·맥·행마·정석·포석 하위 개념(환격·촉촉수·곡사궁·삼연성 등)
#  3) AI 검색 의도 — 카타고·AI 바둑 계열(승률 그래프·추천수·탐색량·영역 예측 등)
#  4) 내부링크 — 이미 게시된 항목과 related 내부링크로 자연스럽게 이어질 것
#
- slug: dan-gup
  title: 단·급
  prompt_hint: 입문~9급 → 1급 → 아마추어 1~7단(또는 9단). 단 차이가 1점 핸디캡에 해당. 한국 바둑 등급 체계.
- slug: gyega
  title: 계가·집
  prompt_hint: 한국 룰의 계가법(territory + 잡은 돌). 종국 절차. 일본 룰과 미세한 차이.
- slug: pae
  title: 패
  prompt_hint: 같은 자리에 즉시 되따냄 금지(동형반복). 패 진행 절차. 패감 개념.
- slug: chuk
  title: 축
  prompt_hint: 직선 추격. 축머리 개념. 축 성립 조건. 초보의 흔한 실수.
- slug: bik
  title: 빅
  prompt_hint: 양쪽 모두 살아 있어 둘 수 없는 상태. 한국 룰의 처리 — 점수 계산 시 빅 안의 집 인정 안 함.
- slug: samsam
  title: 삼삼
  prompt_hint: 3-3 점. 화점에 대한 침입수단. 알파고 이후 정석 변화.
- slug: komi
  title: 덤(komi)
  prompt_hint: 흑 선번 보정. 한국 룰 6.5집(접바둑 0.5집). 일본·중국 룰과 차이.
- slug: handicap
  title: 접바둑·치수
  prompt_hint: 2~9점 접바둑. 흑이 미리 두는 화점 위치. 단 차이만큼 접는 관습.
- slug: hwajeom
  title: 화점
  prompt_hint: 4-4점. 19로 반의 9개 화점 표시. 빠른 세력 확장의 거점.
- slug: kasaeng
  title: 사활
  prompt_hint: 돌의 삶과 죽음. 두 눈의 원칙. 사활 문제는 기력 향상의 핵심.
- slug: jeongseok
  title: 정석
  prompt_hint: 귀에서 흑백이 서로 최선을 주고받아 정형화된 수순. 외워 두면 초반 손해 방지. 상황·주변 배치에 맞게 선택.
- slug: poseok
  title: 포석
  prompt_hint: 초반에 판 전체의 큰 자리(귀→변→중앙)를 배치하는 전략 단계. 화점·소목 등. 세력과 실리의 균형.
- slug: dansu
  title: 단수
  prompt_hint: 돌의 활로가 하나만 남아 다음에 따낼 수 있는 상태. 바둑의 가장 기본 개념. 단수에 몰린 돌은 잇거나 달아나야 함.
- slug: gongbae
  title: 공배
  prompt_hint: 흑·백 어느 쪽 집도 아닌 중립 점. 한국 룰에서 종국 때 메워도 점수에 영향 없음. 수상전에서는 중요한 변수.
- slug: kkutnaegi
  title: 끝내기
  prompt_hint: 종반에 집의 경계를 확정하는 작은 수들. 선수·후수와 집 크기 계산. 역전이 자주 나는 단계.
- slug: susangjeon
  title: 수상전
  prompt_hint: 서로 잡으러 가는 돌끼리 활로를 메워 먼저 잡는 쪽이 이기는 싸움. 수 계산·공배·옥집·빅이 변수.
- slug: okjip
  title: 옥집
  prompt_hint: 눈처럼 보이지만 결함이 있어 결국 메워지는 가짜 눈. 사활에서 진짜 눈과 구별하는 것이 핵심.
- slug: seryeok-silli
  title: 세력·실리
  prompt_hint: 세력은 두터움·영향력, 실리는 확정된 집. 둘의 균형이 바둑 전략의 축. 삼삼 침입 등은 둘의 거래.

# ── 기준 1. 입문 검색 의도 — 두는법·규칙 계열 (12) ───────────────────────────
- slug: chaksu-geumji
  title: 착수금지
  prompt_hint: 놓는 순간 활로가 0이 되는 자리(자살수)에는 둘 수 없다. 다만 그 수로 상대 돌을 따내 활로가 생기면 합법. 패의 되따냄 금지와는 다른 규칙. 관련 항목은 활로·단수·패.
- slug: hwallo
  title: 활로
  prompt_hint: 돌에 맞닿은 빈 점. 활로가 모두 메워지면 돌이 따인다. 연결된 돌은 활로를 함께 쓰므로 이으면 튼튼해진다. 활로가 하나 남은 상태가 단수. 관련 항목은 단수·따냄·자충.
- slug: du-nun
  title: 두 눈
  prompt_hint: 서로 떨어진 진짜 눈 두 개를 갖추면 어떤 공격에도 잡히지 않는다는 삶의 조건. 눈처럼 보여도 결함이 있으면 옥집. 사활 판단의 출발점. 관련 항목은 사활·옥집·궁도.
- slug: jonggung
  title: 종국·패스
  prompt_hint: 더 둘 곳이 없다고 판단하면 패스하고, 양쪽이 연속으로 패스하면 종국. 이후 죽은 돌을 들어내고 계가한다. 잉크바둑은 두 번 연속 패스에서 자동 계가로 넘어간다. 관련 항목은 계가·공배·사석.
- slug: banjip
  title: 반집
  prompt_hint: 덤을 6.5집처럼 0.5 단위로 두어 무승부를 없애는 장치. 반집승은 계가 결과가 0.5집 차이라는 뜻. 끝내기 한 수가 승부를 가르는 이유. 관련 항목은 덤·계가·끝내기.
- slug: gibo
  title: 기보
  prompt_hint: 한 판의 착점을 수순 번호와 좌표로 적어 둔 기록. 가로 알파벳·세로 숫자 좌표를 쓴다. SGF 파일로 저장하면 다른 프로그램에서도 열린다. 복기와 프로 기보 감상의 바탕. 관련 항목은 SGF·복기.
- slug: ieum
  title: 잇기
  prompt_hint: 끊길 자리를 미리 연결해 돌을 하나로 만드는 기본 수법. 곧게 잇기·호구 이음·마늘모 이음 등 모양에 따라 선택이 갈린다. 튼튼함과 한 수의 값을 저울질하는 감각. 관련 항목은 끊기·호구·활로.
- slug: kkeunki
  title: 끊기
  prompt_hint: 상대 돌을 둘로 갈라 각각 약하게 만드는 공격의 출발점. 끊을 곳이 보이면 먼저 살펴보라는 격언이 있다. 끊은 뒤 어느 쪽을 공격할지 계획이 서야 성립. 관련 항목은 잇기·축·장문.
- slug: ttanaem
  title: 따냄
  prompt_hint: 상대 돌의 활로를 모두 메워 판에서 들어내는 것. 따낸 돌은 한국 룰에서 계가 때 상대 집을 메우는 데 쓴다. 한 점 따낸 자리에는 패 규칙이 걸릴 수 있다. 관련 항목은 단수·활로·패.
- slug: badukpan
  title: 바둑판·바둑돌
  prompt_hint: 19줄 판은 가로세로가 만나는 361점에서 두며 흑 181개·백 180개를 쓴다. 판에 찍힌 아홉 개의 점이 화점. 잉크바둑은 9줄·13줄·19줄을 지원한다. 관련 항목은 화점·기보.
- slug: hoseon
  title: 호선
  prompt_hint: 미리 돌을 깔지 않고 흑이 먼저 두되 덤으로 균형을 맞추는 맞바둑. 실력이 비슷할 때의 기본 방식이며 접바둑의 반대말. 관련 항목은 접바둑·치수·덤.
- slug: saseok
  title: 사석
  prompt_hint: 종국 때 살릴 수 없어 들어내는 죽은 돌. 한편 더 큰 이득을 위해 일부러 내주는 버림돌 작전도 사석이라 부른다. 몇 점 주고 두터움을 얻는 거래가 대표적. 관련 항목은 계가·따냄·세력·실리.

# ── 기준 2. 학습 검색 의도 — 사활·맥·행마 (13) ──────────────────────────────
- slug: maek
  title: 맥
  prompt_hint: 국지 전투에서 가장 효율이 높은 급소 한 수. 모양만 그럴듯한 속수와 구별된다. 맥은 외우는 것이 아니라 수읽기로 확인하는 것. 관련 항목은 급소·수읽기·사활.
- slug: suilki
  title: 수읽기
  prompt_hint: 앞으로 이어질 수순을 머릿속으로 두어 보며 결과를 미리 확인하는 능력. 사활 문제와 일일 챌린지로 훈련한다. 한 수 앞이 아니라 상대의 최선까지 읽는 것이 요점. 관련 항목은 사활·맥·급소.
- slug: geupso
  title: 급소
  prompt_hint: 사활과 모양의 요점이 되는 자리. 내가 두면 살고 상대가 두면 죽는 곳이라 상대의 급소가 곧 내 급소다. 궁도의 중앙이 급소인 경우가 많다. 관련 항목은 사활·궁도·오궁도화.
- slug: hwangyeok
  title: 환격
  prompt_hint: 한 점을 일부러 넣어 따내게 한 뒤 그 자리를 되따내 상대 돌을 통째로 잡는 수법. 되따냄이라고도 한다. 초보가 놓치기 쉬운 대표적 맥. 관련 항목은 맥·따냄·촉촉수.
- slug: chokchoksu
  title: 촉촉수
  prompt_hint: 단수를 연달아 몰아 상대가 이어도 소용없게 만들어 결국 전부 잡는 수법. 연단수라고도 한다. 활로가 늘지 않는 형태인지 먼저 확인해야 한다. 관련 항목은 단수·환격·수읽기.
- slug: goksagung
  title: 곡사궁
  prompt_hint: 구부러진 네 집 모양의 궁도. 직사궁과 함께 그대로 살아 있는 형이며, 정사궁·삿갓사궁이 죽는 형이라는 대비로 외운다. 귀에서 생기는 귀곡사는 별개의 예외 형태. 관련 항목은 사활·궁도·두 눈.
- slug: ogungdohwa
  title: 오궁도화
  prompt_hint: 네 집이 뭉친 곳에 한 집이 붙은 다섯 집 모양. 상대가 중앙 급소를 짚으면 두 눈을 못 내고 죽는다. 같은 다섯 집이라도 직오궁·곡오궁은 살아 있다는 대비가 핵심. 관련 항목은 사활·궁도·급소.
- slug: gungdo
  title: 궁도
  prompt_hint: 돌이 두 눈을 낼 수 있는 내부 공간의 넓이. 살려면 궁도를 넓히고 잡으려면 궁도를 좁힌 뒤 급소를 짚는다. 사활의 큰 줄기가 여기서 갈린다. 관련 항목은 사활·급소·두 눈.
- slug: paetgam
  title: 팻감
  prompt_hint: 패를 다시 되따내기 위해 상대가 응수할 수밖에 없는 곳에 두는 수. 팻감의 크기가 패의 값보다 커야 쓸 만하다. 팻감 수와 크기 비교가 패싸움의 승부처. 관련 항목은 패·끝내기·수읽기.
- slug: hogu
  title: 호구
  prompt_hint: 세 점이 한 점을 감싸 입 모양을 이룬 형태. 끊기지 않으면서 눈 모양까지 겸하는 튼튼한 이음이라 실전에서 자주 쓴다. 관련 항목은 잇기·두 눈·옥집.
- slug: jeochim
  title: 젖힘
  prompt_hint: 상대 돌 머리 옆으로 비껴 붙여 나가는 수. 젖히고 잇는 흐름이 기본이며 끊길 여지를 남기므로 뒷수습까지 함께 읽어야 한다. 관련 항목은 잇기·끊기·행마.
- slug: naliljja
  title: 날일자
  prompt_hint: 한 칸 옆으로 두 칸 나아간 자리에 두는 행마(케이마). 한 칸 대각인 마늘모보다 빠르지만 뚫고 끊는 반격이 있다. 굳힘·걸침·씌움에서 가장 흔한 모양. 관련 항목은 행마·굳힘·장문.
- slug: ttwigi
  title: 뜀
  prompt_hint: 자기 돌에서 한 칸 또는 두 칸 곧게 뛰어 달아나거나 넓히는 행마. 한 칸 뜀에 악수 없다는 격언이 있을 만큼 안정적이다. 관련 항목은 행마·날일자·벌림.

# ── 기준 2. 학습 검색 의도 — 정석·포석·운영 (7) ─────────────────────────────
- slug: somok
  title: 소목
  prompt_hint: 귀의 3-4점. 화점보다 실리를 중시하며 한 수 더 두면 귀가 굳는다. 걸침과 정석 갈래가 많아 예부터 애용됐다. 관련 항목은 화점·정석·굳힘.
- slug: samyeonseong
  title: 삼연성
  prompt_hint: 한 변의 화점 셋을 나란히 차지하는 세력형 포석. 중앙 지향의 두터움을 노리며 상대의 침입을 공격으로 되받는 구상. 관련 항목은 포석·화점·세력·실리.
- slug: jungguksik-poseok
  title: 중국식 포석
  prompt_hint: 화점과 소목을 한 변에 배치하고 그 사이를 벌려 실리와 세력을 절충하는 포석. 저중국식·고중국식 갈래가 있다. 관련 항목은 포석·소목·벌림.
- slug: gudim
  title: 굳힘
  prompt_hint: 귀에 한 수를 더해 실리를 확정하는 수. 날일자 굳힘·한 칸 굳힘 등이 있으며 상대의 걸침을 미리 막는 뜻도 있다. 관련 항목은 소목·포석·벌림.
- slug: beollim
  title: 벌림
  prompt_hint: 자기 돌에서 변 쪽으로 적당히 떨어져 두어 근거를 잡고 진영을 넓히는 수. 두 칸·세 칸 벌림의 폭은 배후 돌의 두께로 정한다. 관련 항목은 포석·굳힘·침입·삭감.
- slug: chimip-sakgam
  title: 침입·삭감
  prompt_hint: 상대 진영 안으로 들어가 살아 나오는 것이 침입, 밖에서 경계를 깎아 규모를 줄이는 것이 삭감. 내 돌의 안전과 집 차이를 견줘 고른다. 관련 항목은 세력·실리·삼삼·벌림.
- slug: seonsu-husu
  title: 선수·후수
  prompt_hint: 상대가 반드시 응수해야 해서 주도권이 남는 수가 선수, 내가 한 수를 더 써야 마무리되는 수가 후수. 끝내기 크기 계산의 핵심이며 선수 끝내기를 먼저 두는 것이 원칙. 관련 항목은 끝내기·팻감·반집.

# ── 기준 3. AI 검색 의도 — 카타고·AI 바둑 계열 (8) ──────────────────────────
- slug: seungryul-graph
  title: 승률 그래프
  prompt_hint: 매 수마다 AI가 매긴 승률을 이어 그린 곡선. 완만한 등락은 무시하고 급락 지점만 찾아보면 그 수가 패착이다. 잉크바둑 복기 화면에서 볼 수 있다. 관련 항목은 승률·집차·패착·복기.
- slug: ai-chuchunsu
  title: AI 추천수
  prompt_hint: 탐색 결과 승률이 가장 높게 나온 후보수. 그대로 외우기보다 왜 그 자리인지 이유를 읽어야 실력이 는다. 잉크바둑의 힌트도 같은 원리. 관련 항목은 카타고·승률 그래프·탐색량.
- slug: paechak
  title: 패착
  prompt_hint: 판세를 뒤집은 결정적 악수. 복기에서 승률 낙폭이 가장 큰 수를 찾으면 대개 그것이다. 한 판에 한두 수만 골라 고쳐도 기력이 오른다. 관련 항목은 복기·승률 그래프·수읽기.
- slug: visits
  title: 탐색량
  prompt_hint: AI가 한 수를 고르기 전에 훑어본 후보 수순의 개수(visits). 많을수록 강해지지만 그만큼 오래 걸린다. 잉크바둑은 고른 급수에 맞춰 탐색량을 조절한다. 관련 항목은 카타고·AI 추천수·AI 기력.
- slug: mcts
  title: 몬테카를로 트리 탐색
  prompt_hint: 유망한 수를 골라 깊이 파고드는 탐색 기법(MCTS). 신경망의 평가와 결합해 승률과 집차를 추정한다. 알파고 이후 바둑 AI의 뼈대. 관련 항목은 알파고·카타고·탐색량.
- slug: ownership
  title: 영역 예측
  prompt_hint: 판의 각 점이 끝내 누구 집이 될지를 확률로 나타낸 값(ownership). 형세 판단과 죽은 돌 자동 판정에 쓰인다. 잉크바둑의 자동 사석 판정도 이 값을 쓴다. 관련 항목은 계가·사석·승률·집차.
- slug: bokgi
  title: 복기
  prompt_hint: 끝난 판을 처음부터 다시 두어 보며 갈림길을 짚는 전통 학습법. AI 분석과 결합하면 승률이 흔들린 지점을 바로 찾을 수 있다. 이기든 지든 하는 것이 원칙. 관련 항목은 승률 그래프·패착·기보.
- slug: sgf
  title: SGF
  prompt_hint: 기보를 주고받는 표준 파일 형식(Smart Game Format). 수순·좌표·대국 정보·주석을 담아 어떤 프로그램에서든 열린다. 잉크바둑도 끝난 대국을 SGF로 내려받을 수 있다. 관련 항목은 기보·복기.
